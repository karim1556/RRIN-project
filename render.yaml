services:
  - type: web
    name: retina-ai
    env: python
    buildCommand: "pip install --upgrade pip && pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision && pip install -r requirements.txt"
    startCommand: "uvicorn api.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MODEL_URL
        value: "https://github.com/karim1556/RRIN-project/releases/download/v1.0.0/best_inference.pt"
